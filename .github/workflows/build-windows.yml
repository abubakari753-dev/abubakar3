name: Build CBHIRegistry Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name CBHIRegistry app.py

      - name: Verify EXE
        shell: powershell
        run: |
          if (!(Test-Path "dist\CBHIRegistry.exe")) {
            Write-Error "CBHIRegistry.exe was not created"
            exit 1
          }
          Get-Item "dist\CBHIRegistry.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CBHIRegistry-Windows-EXE
          path: dist/CBHIRegistry.exe
